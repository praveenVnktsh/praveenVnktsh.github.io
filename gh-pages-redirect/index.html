<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Redirecting to praveenvnktsh.com</title>

  <!-- Immediate redirect -->
  <meta http-equiv="refresh" content="0; url=https://praveenvnktsh.com">
  <link rel="canonical" href="https://praveenvnktsh.com">

  <!-- SEO - tell search engines about the move -->

  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      display: flex;

      align-items: center;
      min-height: 100vh;
      margin: 0;
      background: #0a0a0a;
      color: #e5e5e5;
    }
    .container {
      text-align: center;
      padding: 2rem;
    }
    h1 {
      font-size: 1.5rem;
      margin-bottom: 1rem;
    }
    a {
      color: #60a5fa;
      text-decoration: none;
    }
    a:hover {
      text-decoration: underline;
    }
    .spinner {
      width: 40px;
      height: 40px;
      border: 3px solid #262626;
      border-top-color: #60a5fa;

    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="container">

  </div>

  <script>

    window.location.replace('https://praveenvnktsh.com');

</html>
